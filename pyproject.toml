[project]
name = "farmer-rag"
version = "0.1.0"
description = "Production-grade RAG over a homeopathy-in-farming book: hybrid retrieval, local reranking, corrective LangGraph flow, CLI + Streamlit"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "langchain>=1.3.15",
    "langchain-chroma>=1.1.0",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.5.1",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.11",
    "pydantic-settings>=2.15.0",
    "pymupdf4llm>=1.28.2",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
    "rich>=15.0.0",
    "streamlit>=1.61.1",
    "typer>=0.27.1",
]

[project.scripts]
farmer-rag = "farmer_rag.cli:app"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

# Flat layout: the `farmer_rag` package lives at the repository root.
[tool.uv.build-backend]
module-root = ""
module-name = "farmer_rag"

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
include = ["farmer_rag", "tests"]
extraPaths = ["."]
executionEnvironments = [{ root = "." }]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
